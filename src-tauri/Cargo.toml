[package]
name = "deskumi"
version = "0.1.0"
description = "Interactive 2D/3D desktop companion engine"
authors = ["crivera"]
edition = "2021"

[lib]
name = "deskumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
cairo-rs = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
