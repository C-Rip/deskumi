name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          node .github/scripts/extract-changelog.js CHANGELOG.md "${{ github.ref_name }}"

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Deskumi ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Generate and upload checksums
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            cd "$BUNDLE_DIR"
            echo "Scanning for bundles in $BUNDLE_DIR..."
            # Find all release bundles (.deb, .AppImage, .rpm, .msi, .exe)
            FILES=$(find . -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" -o -name "*.msi" -o -name "*.exe" \) | grep -v "\.sha256$" | sort)
            if [ -n "$FILES" ]; then
              for file in $FILES; do
                filename=$(basename "$file")
                dirname=$(dirname "$file")
                (cd "$dirname" && sha256sum "$filename" > "${filename}.sha256")
                echo "Generated checksum: ${file}.sha256"
              done

              # Consolidated checksum file for this platform
              sha256sum $FILES > "SHA256SUMS-${{ matrix.platform }}.txt"

              # Upload individual and consolidated checksums
              CHECKSUM_FILES=$(find . -type f \( -name "*.sha256" -o -name "SHA256SUMS-*.txt" \))
              echo "Uploading checksum files: $CHECKSUM_FILES"
              gh release upload "${{ github.ref_name }}" $CHECKSUM_FILES --clobber
            else
              echo "No bundles found to compute checksums."
            fi
          else
            echo "Bundle directory $BUNDLE_DIR not found."
          fi

      - name: Sync release notes with changelog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "release-notes.md" ]; then
            gh release edit "${{ github.ref_name }}" --notes-file release-notes.md || true
          fi
